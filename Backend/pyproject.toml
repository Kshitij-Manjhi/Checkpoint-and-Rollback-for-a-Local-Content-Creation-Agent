[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-checkpoint-runtime"
version = "0.7.0"
description = "A research prototype for verifiable checkpoint and rollback in local LLM agent workflows"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "mysql-connector-python>=8.3", "chromadb>=0.5.0", "python-dotenv>=1.0"]

[project.optional-dependencies]
test = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
